<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Display Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .network-list {
            margin-top: 15px;
        }

        .network-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .network-name {
            font-weight: 500;
            color: #333;
        }

        .remove-btn {
            padding: 6px 12px;
            background: #ef5350;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .remove-btn:hover {
            background: #d32f2f;
        }

        .help-text {
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Train Display Setup</h1>
            <p>Configure your WiFi connection</p>
        </div>

        <div class="content">
            <div id="status-message"></div>

            <div class="section">
                <h2 class="section-title">Add WiFi Network</h2>

                <form id="wifi-form">
                    <div class="form-group">
                        <label for="ssid">Network Name (SSID)</label>
                        <input type="text" id="ssid" name="ssid" placeholder="Enter WiFi name" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter WiFi password" required>
                        <p class="help-text">Your credentials are stored locally on the device</p>
                    </div>

                    <button type="submit">Connect to WiFi</button>
                </form>
            </div>

            <div class="divider"></div>

            <div class="section">
                <h2 class="section-title">Saved Networks</h2>
                <div id="network-list" class="network-list">
                    <p class="help-text">Loading networks...</p>
                </div>
            </div>

            <div id="loading">
                <div class="spinner"></div>
                <p>Connecting to WiFi...</p>
            </div>
        </div>
    </div>

    <script>
        // Load saved networks on page load
        window.addEventListener('DOMContentLoaded', loadNetworks);

        // Handle form submission
        document.getElementById('wifi-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!ssid || !password) {
                showMessage('Please enter both SSID and password', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/wifi/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' The page will reload once connected.', 'success');
                    document.getElementById('wifi-form').reset();

                    // Reload networks after a delay
                    setTimeout(() => {
                        loadNetworks();
                    }, 2000);

                    // Show message about potential connection loss
                    setTimeout(() => {
                        showMessage('Connecting to WiFi... You may need to reconnect to your home WiFi and access the device at its new IP address.', 'info');
                    }, 3000);

                } else {
                    showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                    showLoading(false);
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
                showLoading(false);
            }
        });

        async function loadNetworks() {
            try {
                const response = await fetch('/api/networks');
                const data = await response.json();

                const networkList = document.getElementById('network-list');

                if (data.networks && data.networks.length > 0) {
                    networkList.innerHTML = data.networks.map(network => `
                        <div class="network-item">
                            <span class="network-name">${escapeHtml(network.ssid)}</span>
                            <button class="remove-btn" onclick="removeNetwork('${escapeHtml(network.ssid)}')">Remove</button>
                        </div>
                    `).join('');
                } else {
                    networkList.innerHTML = '<p class="help-text">No saved networks yet</p>';
                }

            } catch (error) {
                console.error('Error loading networks:', error);
                document.getElementById('network-list').innerHTML =
                    '<p class="help-text">Error loading networks</p>';
            }
        }

        async function removeNetwork(ssid) {
            if (!confirm(`Remove network "${ssid}"?`)) {
                return;
            }

            try {
                const response = await fetch('/api/wifi/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    loadNetworks();
                } else {
                    showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
            }
        }

        function showMessage(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="status ${type}">${escapeHtml(message)}</div>`;

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                }, 5000);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('wifi-form').style.display = show ? 'none' : 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
