<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Zurückbleiben Bitte Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .mono {
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 60px;
        }

        .current-config {
            margin-bottom: 80px;
            padding: 40px 0;
            border-top: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        .config-row {
            display: flex;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .config-label {
            width: 120px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .config-value {
            font-family: 'Courier New', Courier, monospace;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 15px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ff9900;
            color: #ff9900;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-bottom: 2px solid #ff9900;
        }

        input::placeholder {
            color: #666;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #ddd;
        }

        button:active {
            background: #bbb;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .search-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        .search-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .search-row button {
            margin-top: 0;
            flex-shrink: 0;
        }

        .message {
            padding: 15px 0;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border-bottom: 1px solid #fff;
        }

        .message.error {
            color: #ff6b6b;
        }

        .message.success {
            color: #51cf66;
        }

        .station-list {
            margin-top: 20px;
        }

        .station-item {
            padding: 15px 0;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }

        .station-item:hover {
            border-bottom: 1px solid #fff;
        }

        .station-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .station-meta {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .transport-selection {
            margin-top: 30px;
            padding: 30px 0;
            border-top: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        .transport-option {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .transport-option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #ff9900;
        }

        .transport-option label {
            margin: 0;
            cursor: pointer;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .button-group button {
            flex: 1;
        }

        .button-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
        }

        .button-secondary:hover {
            background: #fff;
            color: #000;
        }

        .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .delay-form-compact {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .delay-form-compact .form-group {
            margin-bottom: 0;
            flex: 0 0 120px;
        }

        .delay-form-compact input {
            width: 100%;
        }

        .delay-form-compact button {
            margin-top: 0;
            flex-shrink: 0;
        }

        .section-compact {
            margin-bottom: 40px;
        }

        .section-compact h2 {
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .network-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        .network-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        .remove-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 15px;
            font-size: 10px;
            margin-top: 0;
        }

        .remove-btn:hover {
            background: #fff;
            color: #000;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zurückbleiben Bitte Display</h1>

        <div id="main-content">
            <!-- WiFi Setup Mode (shown when not connected) -->
            <div id="setup-mode" style="display: none;">
                <div id="status-message"></div>

                <div class="section">
                    <h2>Add WiFi Network</h2>
                    <form id="wifi-form">
                        <div class="form-group">
                            <label for="ssid">Network Name</label>
                            <input type="text" id="ssid" name="ssid" placeholder="enter ssid" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="enter password" required>
                            <p class="help-text">credentials stored locally</p>
                        </div>

                        <button type="submit">Connect</button>
                    </form>
                </div>

                <div class="section">
                    <h2>Saved Networks</h2>
                    <div id="network-list"></div>
                </div>

                <div id="loading">
                    <div class="spinner"></div>
                    <p class="mono">Connecting...</p>
                </div>
            </div>

            <!-- Connected Mode (shown when connected via WiFi) -->
            <div id="connected-mode" style="display: none;">
                <div class="current-config">
                    <h2>Current Configuration</h2>
                    <div class="config-row">
                        <span class="config-label">Station</span>
                        <span class="config-value" id="current-station">—</span>
                    </div>
                    <div class="config-row">
                        <span class="config-label">Transport</span>
                        <span class="config-value" id="current-transport">—</span>
                    </div>
                    <div class="config-row">
                        <span class="config-label">Directions</span>
                        <span class="config-value" id="current-directions">—</span>
                    </div>
                    <div class="config-row">
                        <span class="config-label">Delay</span>
                        <span class="config-value" id="current-delay">—</span>
                    </div>
                    <div class="config-row">
                        <span class="config-label">WiFi</span>
                        <span class="config-value" id="current-wifi">—</span>
                    </div>
                </div>

                <div id="connected-status-message"></div>

                <h2 style="margin-top: 40px; margin-bottom: 30px;">Change Configuration</h2>

                <div class="section-compact">
                    <h2>Departure Delay</h2>
                    <form id="delay-form" class="delay-form-compact">
                        <div class="form-group">
                            <label for="delay-minutes">Minutes</label>
                            <input type="number" id="delay-minutes" name="delay-minutes" min="0" max="120" placeholder="10">
                        </div>
                        <button type="submit">Save</button>
                    </form>
                </div>

                <div class="section">
                    <h2>Select Station</h2>
                    <p class="help-text" style="margin-bottom: 20px;">Type the name of the station you want and press search.</p>
                    <form id="station-search-form">
                        <div class="search-row">
                            <div class="form-group">
                                <label for="station-search">Search</label>
                                <input type="text" id="station-search" name="station-search" placeholder="enter station name" autocomplete="off">
                            </div>
                            <button type="button" id="search-stations-btn">Search</button>
                        </div>
                    </form>
                    <div id="station-results"></div>
                </div>

                <div id="station-status-message"></div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            checkConnectionStatus();
        });

        async function checkConnectionStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.wifi_connected && data.current_ssid) {
                    showConnectedInterface(data);
                } else {
                    showSetupMode();
                }
            } catch (error) {
                console.error('Error checking status:', error);
                showSetupMode();
            }
        }

        function showSetupMode() {
            document.getElementById('setup-mode').style.display = 'block';
            document.getElementById('connected-mode').style.display = 'none';
            loadNetworks();
        }

        function showConnectedInterface(status) {
            document.getElementById('setup-mode').style.display = 'none';
            document.getElementById('connected-mode').style.display = 'block';

            document.getElementById('current-station').textContent = status.train_station?.name || '—';
            document.getElementById('current-transport').textContent = getTransportTypeNames(status.transport_type || 'U');
            document.getElementById('current-directions').textContent = getDirectionNames(status.directions || 'N,S,E,W');
            document.getElementById('current-delay').textContent = (status.delay_minutes || 10) + ' min';
            document.getElementById('current-wifi').textContent = status.current_ssid || '—';

            document.getElementById('delay-minutes').value = status.delay_minutes || 10;

            const delayForm = document.getElementById('delay-form');
            delayForm.onsubmit = async (e) => {
                e.preventDefault();
                await updateDelay();
            };

            const searchBtn = document.getElementById('search-stations-btn');
            const searchInput = document.getElementById('station-search');

            searchBtn.onclick = () => {
                const query = searchInput.value.trim();
                if (query) {
                    searchStations(query);
                } else {
                    showMessage('enter a station name', 'error', 'station-results');
                }
            };

            searchInput.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = e.target.value.trim();
                    if (query) searchStations(query);
                }
            };
        }

        function getTransportTypeName(code) {
            const names = {
                'S': 'S-Bahn',
                'U': 'U-Bahn',
                'T': 'Tram',
                'B': 'Bus',
                'F': 'Ferry',
                'E': 'Express',
                'R': 'Regional'
            };
            return names[code] || code;
        }

        function getTransportTypeNames(typeString) {
            if (!typeString) return '—';
            const types = typeString.split(',').map(t => t.trim());
            return types.map(t => getTransportTypeName(t)).join(', ');
        }

        function getDirectionName(code) {
            const names = {
                'N': 'North',
                'S': 'South',
                'E': 'East',
                'W': 'West'
            };
            return names[code.toUpperCase()] || code;
        }

        function getDirectionNames(directionString) {
            if (!directionString) return 'All';
            const directions = directionString.split(',').map(d => d.trim());
            // If all 4 directions are selected, show "All"
            if (directions.length === 4) return 'All';
            return directions.map(d => getDirectionName(d)).join(', ');
        }

        function getAvailableTransportTypes(products) {
            const types = [];
            if (products.suburban) types.push('S');
            if (products.subway) types.push('U');
            if (products.tram) types.push('T');
            if (products.bus) types.push('B');
            if (products.ferry) types.push('F');
            if (products.express) types.push('E');
            if (products.regional) types.push('R');
            return types;
        }

        async function updateDelay() {
            const delayMinutes = document.getElementById('delay-minutes').value;

            if (!delayMinutes || delayMinutes < 0 || delayMinutes > 120) {
                showMessage('enter valid delay (0-120)', 'error', 'connected-status-message');
                return;
            }

            try {
                const response = await fetch('/api/delay/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ delay_minutes: parseInt(delayMinutes) })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('delay updated', 'success', 'connected-status-message');
                    setTimeout(() => checkConnectionStatus(), 1000);
                } else {
                    showMessage('error: ' + (data.error || 'unknown'), 'error', 'connected-status-message');
                }
            } catch (error) {
                showMessage('network error', 'error', 'connected-status-message');
            }
        }

        async function searchStations(query) {
            const resultsDiv = document.getElementById('station-results');
            resultsDiv.innerHTML = '<p class="help-text mono">searching...</p>';

            try {
                const response = await fetch(`/api/stations/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.success && data.stations && data.stations.length > 0) {
                    resultsDiv.innerHTML = `
                        <div class="station-list">
                            ${data.stations.map((station, index) => {
                                const availableTypes = getAvailableTransportTypes(station.products || {});
                                const typeLabels = availableTypes.map(t => getTransportTypeName(t)).join(', ');
                                return `
                                <div class="station-item" onclick="selectStationForConfig('${escapeHtml(station.id)}', '${escapeHtml(station.name)}', '${availableTypes.join(',')}')">
                                    <div class="station-name">${escapeHtml(station.name)}</div>
                                    <div class="station-meta">${escapeHtml(station.id)}${availableTypes.length > 0 ? ' • ' + typeLabels : ''}</div>
                                </div>
                            `;
                            }).join('')}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = '<p class="help-text">no stations found</p>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<p class="help-text" style="color: #ff6b6b;">search error</p>';
            }
        }

        function selectStationForConfig(stationId, stationName, availableTypesStr) {
            const availableTypes = availableTypesStr ? availableTypesStr.split(',').filter(t => t) : [];
            showTransportSelection(stationId, stationName, availableTypes);
        }

        function showTransportSelection(stationId, stationName, availableTypes) {
            const statusDiv = document.getElementById('station-status-message');

            const allTransportTypes = [
                { code: 'S', name: 'S-Bahn' },
                { code: 'U', name: 'U-Bahn' },
                { code: 'T', name: 'Tram' },
                { code: 'B', name: 'Bus' },
                { code: 'F', name: 'Ferry' },
                { code: 'E', name: 'Express' },
                { code: 'R', name: 'Regional' }
            ];

            const typesToShow = availableTypes.length > 0
                ? allTransportTypes.filter(t => availableTypes.includes(t.code))
                : allTransportTypes;

            const transportOptions = typesToShow.map(type => `
                <div class="transport-option">
                    <input type="checkbox" id="transport-${type.code}" value="${type.code}" ${availableTypes.includes(type.code) ? 'checked' : ''}>
                    <label for="transport-${type.code}">${type.name}</label>
                </div>
            `).join('');

            const directionOptions = `
                <div class="transport-option">
                    <input type="checkbox" id="direction-N" value="N" checked>
                    <label for="direction-N">North</label>
                </div>
                <div class="transport-option">
                    <input type="checkbox" id="direction-S" value="S" checked>
                    <label for="direction-S">South</label>
                </div>
                <div class="transport-option">
                    <input type="checkbox" id="direction-E" value="E" checked>
                    <label for="direction-E">East</label>
                </div>
                <div class="transport-option">
                    <input type="checkbox" id="direction-W" value="W" checked>
                    <label for="direction-W">West</label>
                </div>
            `;

            statusDiv.innerHTML = `
                <div class="transport-selection">
                    <h2>Select Station</h2>
                    <p class="help-text mono" style="margin-bottom: 20px;">station: ${escapeHtml(stationName)}</p>
                    <h3 style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px;">Select Transport Types</h3>
                    ${transportOptions}
                    <h3 style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin: 25px 0 15px 0;">Select Directions</h3>
                    <p class="help-text" style="margin-bottom: 15px;">Only show trains heading in these directions</p>
                    ${directionOptions}
                    <div class="button-group">
                        <button onclick="saveStationConfig('${escapeHtml(stationId)}', '${escapeHtml(stationName)}')">Save</button>
                        <button class="button-secondary" onclick="document.getElementById('station-status-message').innerHTML = ''">Cancel</button>
                    </div>
                </div>
            `;

            statusDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function saveStationConfig(stationId, stationName) {
            // Get transport types
            const transportCheckboxes = document.querySelectorAll('.transport-option input[type="checkbox"]:checked:not([id^="direction-"])');
            const selectedTypes = Array.from(transportCheckboxes).map(cb => cb.value);

            if (selectedTypes.length === 0) {
                showMessage('select at least one transport type', 'error', 'station-status-message');
                return;
            }

            // Get directions
            const directionCheckboxes = document.querySelectorAll('.transport-option input[type="checkbox"][id^="direction-"]:checked');
            const selectedDirections = Array.from(directionCheckboxes).map(cb => cb.value);

            if (selectedDirections.length === 0) {
                showMessage('select at least one direction', 'error', 'station-status-message');
                return;
            }

            // Join multiple types/directions with comma for backend
            const transportTypes = selectedTypes.join(',');
            const directions = selectedDirections.join(',');
            selectStation(stationId, stationName, transportTypes, directions);
        }

        async function selectStation(stationId, stationName, transportType, directions) {
            const statusDiv = document.getElementById('station-status-message');

            try {
                statusDiv.innerHTML = '<p class="message mono">updating...</p>';

                const response = await fetch('/api/station/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        station_id: stationId,
                        station_name: stationName,
                        transport_type: transportType,
                        directions: directions
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `<p class="message success mono">station updated: ${escapeHtml(stationName)}</p>`;
                    document.getElementById('station-results').innerHTML = '';
                    document.getElementById('station-search').value = '';
                    setTimeout(() => {
                        statusDiv.innerHTML = '';
                        checkConnectionStatus();
                    }, 2000);
                } else {
                    statusDiv.innerHTML = `<p class="message error mono">error: ${escapeHtml(data.error || 'unknown')}</p>`;
                }
            } catch (error) {
                statusDiv.innerHTML = '<p class="message error mono">network error</p>';
            }
        }

        // WiFi form submission
        document.getElementById('wifi-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!ssid || !password) {
                showMessage('enter ssid and password', 'error', 'status-message');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/wifi/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('connecting...', 'success', 'status-message');
                    document.getElementById('wifi-form').reset();
                    setTimeout(() => loadNetworks(), 2000);
                } else {
                    showMessage('error: ' + (data.error || 'unknown'), 'error', 'status-message');
                    showLoading(false);
                }
            } catch (error) {
                showMessage('network error', 'error', 'status-message');
                showLoading(false);
            }
        });

        async function loadNetworks() {
            try {
                const response = await fetch('/api/networks');
                const data = await response.json();
                const networkList = document.getElementById('network-list');

                if (data.networks && data.networks.length > 0) {
                    networkList.innerHTML = data.networks.map(network => `
                        <div class="network-item">
                            <span class="network-name">${escapeHtml(network.ssid)}</span>
                            <button class="remove-btn" onclick="removeNetwork('${escapeHtml(network.ssid)}')">Remove</button>
                        </div>
                    `).join('');
                } else {
                    networkList.innerHTML = '<p class="help-text">no saved networks</p>';
                }
            } catch (error) {
                document.getElementById('network-list').innerHTML = '<p class="help-text">error loading networks</p>';
            }
        }

        async function removeNetwork(ssid) {
            if (!confirm(`remove "${ssid}"?`)) return;

            try {
                const response = await fetch('/api/wifi/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('network removed', 'success', 'status-message');
                    loadNetworks();
                } else {
                    showMessage('error: ' + (data.error || 'unknown'), 'error', 'status-message');
                }
            } catch (error) {
                showMessage('network error', 'error', 'status-message');
            }
        }

        function showMessage(message, type, targetId) {
            const div = document.getElementById(targetId);
            if (div) {
                div.innerHTML = `<p class="message ${type} mono">${escapeHtml(message)}</p>`;
                if (type === 'success' || type === 'error') {
                    setTimeout(() => { div.innerHTML = ''; }, 3000);
                }
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('wifi-form').style.display = show ? 'none' : 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
