<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Display Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            width: auto;
        }

        .toggle-password:hover {
            color: #764ba2;
            transform: translateY(-50%);
            box-shadow: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .network-list {
            margin-top: 15px;
        }

        .network-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .network-name {
            font-weight: 500;
            color: #333;
        }

        .remove-btn {
            padding: 6px 12px;
            background: #ef5350;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .remove-btn:hover {
            background: #d32f2f;
        }

        .help-text {
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .station-item {
            transition: background 0.2s;
        }

        .station-item:hover {
            background: #e0e0e0 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Train Display Setup</h1>
            <p>Configure your WiFi connection</p>
        </div>

        <div class="content">
            <div id="status-message"></div>

            <div class="section">
                <h2 class="section-title">Add WiFi Network</h2>

                <form id="wifi-form">
                    <div class="form-group">
                        <label for="ssid">Network Name (SSID)</label>
                        <input type="text" id="ssid" name="ssid" placeholder="Enter WiFi name" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter WiFi password" required style="padding-right: 70px;">
                            <button type="button" class="toggle-password" onclick="togglePassword()">Show</button>
                        </div>
                        <p class="help-text">Your credentials are stored locally on the device</p>
                    </div>

                    <button type="submit">Connect to WiFi</button>
                </form>
            </div>

            <div class="divider"></div>

            <div class="section">
                <h2 class="section-title">Saved Networks</h2>
                <div id="network-list" class="network-list">
                    <p class="help-text">Loading networks...</p>
                </div>
            </div>

            <div id="loading">
                <div class="spinner"></div>
                <p>Connecting to WiFi...</p>
            </div>
        </div>
    </div>

    <script>
        // Load saved networks and check status on page load
        window.addEventListener('DOMContentLoaded', () => {
            checkConnectionStatus();
            loadNetworks();
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = event.target;

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        async function checkConnectionStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.wifi_connected && data.current_ssid) {
                    // Connected to WiFi - show different interface
                    showConnectedInterface(data);
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function showConnectedInterface(status) {
            const header = document.querySelector('.header');
            header.innerHTML = `
                <h1>Train Display Configuration</h1>
                <p>Connected via WiFi: ${escapeHtml(status.current_ssid || 'Unknown')}</p>
            `;

            const content = document.querySelector('.content');
            content.innerHTML = `
                <div class="status info">
                    <strong>✓ Connected to Raspberry Pi via WiFi</strong><br>
                    You are accessing the configuration interface over your home WiFi network.
                </div>

                <div id="connected-status-message"></div>

                <div class="section">
                    <h2 class="section-title">Connection Status</h2>
                    <p style="margin-bottom: 10px;"><strong>WiFi Network:</strong> ${escapeHtml(status.current_ssid || 'Unknown')}</p>
                    <p style="margin-bottom: 10px;"><strong>Saved Networks:</strong> ${status.saved_networks_count || 0}</p>
                    <p class="help-text">The train display is operating normally</p>
                </div>

                <div class="divider"></div>

                <div class="section">
                    <h2 class="section-title">Departure Delay</h2>
                    <p class="help-text" style="margin-bottom: 15px;">
                        Configure how many minutes in the future to show train departures.
                    </p>
                    <form id="delay-form" style="margin-bottom: 15px;">
                        <div class="form-group">
                            <label for="delay-minutes">Delay (minutes)</label>
                            <input
                                type="number"
                                id="delay-minutes"
                                name="delay-minutes"
                                min="0"
                                max="120"
                                value="${status.delay_minutes || 10}"
                                placeholder="Enter delay in minutes"
                                style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;"
                            >
                            <p class="help-text">Show trains departing in more than this many minutes (0-120)</p>
                        </div>
                        <button type="submit" style="margin-top: 10px;">Save Delay</button>
                    </form>
                    <p class="help-text"><strong>Current setting:</strong> ${status.delay_minutes || 10} minutes</p>
                </div>

                <div class="divider"></div>

                <div class="section">
                    <h2 class="section-title">Train Station Configuration</h2>
                    <p class="help-text" style="margin-bottom: 15px;">
                        Current station: <strong>${escapeHtml(status.train_station?.name || 'Unknown')}</strong>
                        (ID: ${escapeHtml(status.train_station?.id || 'Unknown')})
                    </p>
                    <p class="help-text" style="margin-bottom: 15px;">
                        Current transport type: <strong>${getTransportTypeName(status.transport_type || 'U')}</strong>
                    </p>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Transport Type Filter</label>
                        <select id="transport-type-select" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                            <option value="S" ${(status.transport_type || 'U') === 'S' ? 'selected' : ''}>S-Bahn (Suburban)</option>
                            <option value="U" ${(status.transport_type || 'U') === 'U' ? 'selected' : ''}>U-Bahn (Subway)</option>
                            <option value="T" ${(status.transport_type || 'U') === 'T' ? 'selected' : ''}>Tram</option>
                            <option value="B" ${(status.transport_type || 'U') === 'B' ? 'selected' : ''}>Bus</option>
                            <option value="F" ${(status.transport_type || 'U') === 'F' ? 'selected' : ''}>Ferry</option>
                            <option value="E" ${(status.transport_type || 'U') === 'E' ? 'selected' : ''}>Express (IC/ICE)</option>
                            <option value="R" ${(status.transport_type || 'U') === 'R' ? 'selected' : ''}>Regional (RB/RE)</option>
                        </select>
                        <button type="button" id="update-transport-btn" style="margin-top: 10px; width: 100%;">Update Transport Type</button>
                    </div>

                    <div class="divider" style="margin: 20px 0;"></div>

                    <form id="station-search-form" style="margin-bottom: 15px;">
                        <div class="form-group">
                            <label for="station-search">Search for a station</label>
                            <input
                                type="text"
                                id="station-search"
                                name="station-search"
                                placeholder="Enter station name (e.g., Alexanderplatz)"
                                autocomplete="off"
                                style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;"
                            >
                            <div id="station-results" style="margin-top: 10px;"></div>
                        </div>
                    </form>
                    <div id="station-status-message"></div>
                </div>

                <div class="divider"></div>

                <div class="section">
                    <h2 class="section-title">Setup Mode</h2>
                    <p class="help-text" style="margin-bottom: 15px;">
                        To add or modify WiFi networks, disconnect from the current WiFi or manually activate setup mode on the device.
                    </p>
                </div>
            `;

            // Add event listener for delay form
            document.getElementById('delay-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await updateDelay();
            });

            // Add event listener for transport type update
            const transportTypeSelect = document.getElementById('transport-type-select');
            const updateTransportBtn = document.getElementById('update-transport-btn');
            if (updateTransportBtn) {
                updateTransportBtn.addEventListener('click', async () => {
                    await updateTransportType();
                });
            }

            // Add event listener for station search
            const stationSearchInput = document.getElementById('station-search');
            if (stationSearchInput) {
                let searchTimeout;
                stationSearchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim();
                    
                    // Clear previous timeout
                    clearTimeout(searchTimeout);
                    
                    // Clear results if query is empty
                    if (!query) {
                        document.getElementById('station-results').innerHTML = '';
                        return;
                    }
                    
                    // Debounce search - wait 500ms after user stops typing
                    searchTimeout = setTimeout(() => {
                        searchStations(query);
                    }, 500);
                });
            }
        }

        function getTransportTypeName(code) {
            const names = {
                'S': 'S-Bahn (Suburban)',
                'U': 'U-Bahn (Subway)',
                'T': 'Tram',
                'B': 'Bus',
                'F': 'Ferry',
                'E': 'Express (IC/ICE)',
                'R': 'Regional (RB/RE)'
            };
            return names[code] || code;
        }

        function getAvailableTransportTypes(products) {
            const types = [];
            if (products.suburban) types.push('S');
            if (products.subway) types.push('U');
            if (products.tram) types.push('T');
            if (products.bus) types.push('B');
            if (products.ferry) types.push('F');
            if (products.express) types.push('E');
            if (products.regional) types.push('R');
            return types;
        }

        async function updateDelay() {
            const delayMinutes = document.getElementById('delay-minutes').value;

            if (!delayMinutes || delayMinutes < 0 || delayMinutes > 120) {
                showConnectedMessage('Please enter a valid delay between 0 and 120 minutes', 'error');
                return;
            }

            try {
                const response = await fetch('/api/delay/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ delay_minutes: parseInt(delayMinutes) })
                });

                const data = await response.json();

                if (data.success) {
                    showConnectedMessage(data.message, 'success');
                    // Immediately reload status to show updated value
                    checkConnectionStatus();
                } else {
                    showConnectedMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showConnectedMessage('Network error. Please try again.', 'error');
            }
        }

        async function searchStations(query) {
            const resultsDiv = document.getElementById('station-results');
            if (!resultsDiv) return;

            try {
                resultsDiv.innerHTML = '<p class="help-text">Searching...</p>';
                
                const response = await fetch(`/api/stations/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.success && data.stations && data.stations.length > 0) {
                    resultsDiv.innerHTML = `
                        <div style="max-height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px;">
                            ${data.stations.map(station => {
                                const availableTypes = getAvailableTransportTypes(station.products || {});
                                const typeLabels = availableTypes.map(t => getTransportTypeName(t)).join(', ');
                                return `
                                <div 
                                    class="station-item" 
                                    style="padding: 10px; margin-bottom: 5px; background: #f5f5f5; border-radius: 6px; cursor: pointer; transition: background 0.2s;"
                                    onclick="showStationSelection('${escapeHtml(station.id)}', '${escapeHtml(station.name)}', ${JSON.stringify(availableTypes)})"
                                    onmouseover="this.style.background='#e0e0e0'"
                                    onmouseout="this.style.background='#f5f5f5'"
                                >
                                    <div style="font-weight: 500; color: #333;">${escapeHtml(station.name)}</div>
                                    <div style="font-size: 12px; color: #777; margin-top: 4px;">
                                        ID: ${escapeHtml(station.id)}
                                        ${station.distance ? ` • ${Math.round(station.distance)}m away` : ''}
                                    </div>
                                    ${availableTypes.length > 0 ? `<div style="font-size: 11px; color: #667eea; margin-top: 4px;">Available: ${escapeHtml(typeLabels)}</div>` : ''}
                                </div>
                            `;
                            }).join('')}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = '<p class="help-text">No stations found. Try a different search term.</p>';
                }
            } catch (error) {
                console.error('Error searching stations:', error);
                resultsDiv.innerHTML = '<p class="help-text" style="color: #c62828;">Error searching stations. Please try again.</p>';
            }
        }

        function showStationSelection(stationId, stationName, availableTypes) {
            const statusDiv = document.getElementById('station-status-message');
            if (!statusDiv) return;

            if (availableTypes.length === 0) {
                // No transport types available, just select the station with current transport type
                const currentTransportType = document.getElementById('transport-type-select')?.value || 'U';
                selectStation(stationId, stationName, currentTransportType);
                return;
            }

            // Show transport type selection dialog
            const transportOptions = availableTypes.map(type => 
                `<option value="${type}">${getTransportTypeName(type)}</option>`
            ).join('');

            statusDiv.innerHTML = `
                <div style="padding: 15px; background: #f5f5f5; border-radius: 8px; margin-top: 10px;">
                    <div style="font-weight: 500; margin-bottom: 10px;">Select transport type for ${escapeHtml(stationName)}:</div>
                    <select id="station-transport-select" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px;">
                        ${transportOptions}
                    </select>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="selectStation('${escapeHtml(stationId)}', '${escapeHtml(stationName)}', document.getElementById('station-transport-select').value)" style="flex: 1; padding: 10px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">Select</button>
                        <button onclick="document.getElementById('station-status-message').innerHTML = ''" style="flex: 1; padding: 10px; background: #ccc; color: #333; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
                    </div>
                </div>
            `;
        }

        async function selectStation(stationId, stationName, transportType = null) {
            const statusDiv = document.getElementById('station-status-message');
            const resultsDiv = document.getElementById('station-results');
            const searchInput = document.getElementById('station-search');

            // Use provided transport type or current selection
            if (!transportType) {
                transportType = document.getElementById('transport-type-select')?.value || 'U';
            }

            try {
                if (statusDiv) {
                    statusDiv.innerHTML = '<div class="status info">Updating station...</div>';
                }

                const response = await fetch('/api/station/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        station_id: stationId,
                        station_name: stationName,
                        transport_type: transportType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    if (statusDiv) {
                        statusDiv.innerHTML = `<div class="status success">${escapeHtml(data.message)}</div>`;
                    }
                    
                    // Clear search results and input
                    if (resultsDiv) resultsDiv.innerHTML = '';
                    if (searchInput) searchInput.value = '';
                    
                    // Reload status to show updated station
                    setTimeout(() => {
                        checkConnectionStatus();
                    }, 2000);
                } else {
                    if (statusDiv) {
                        statusDiv.innerHTML = `<div class="status error">Error: ${escapeHtml(data.error || 'Unknown error')}</div>`;
                    }
                }
            } catch (error) {
                console.error('Error updating station:', error);
                if (statusDiv) {
                    statusDiv.innerHTML = '<div class="status error">Network error. Please try again.</div>';
                }
            }
        }

        async function updateTransportType() {
            const transportTypeSelect = document.getElementById('transport-type-select');
            const statusDiv = document.getElementById('station-status-message');
            
            if (!transportTypeSelect) return;

            const transportType = transportTypeSelect.value;

            try {
                if (statusDiv) {
                    statusDiv.innerHTML = '<div class="status info">Updating transport type...</div>';
                }

                const response = await fetch('/api/transport/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ transport_type: transportType })
                });

                const data = await response.json();

                if (data.success) {
                    if (statusDiv) {
                        statusDiv.innerHTML = `<div class="status success">${escapeHtml(data.message)}</div>`;
                    }
                    
                    // Reload status to show updated transport type
                    setTimeout(() => {
                        checkConnectionStatus();
                    }, 2000);
                } else {
                    if (statusDiv) {
                        statusDiv.innerHTML = `<div class="status error">Error: ${escapeHtml(data.error || 'Unknown error')}</div>`;
                    }
                }
            } catch (error) {
                console.error('Error updating transport type:', error);
                if (statusDiv) {
                    statusDiv.innerHTML = '<div class="status error">Network error. Please try again.</div>';
                }
            }
        }

        function showConnectedMessage(message, type) {
            const statusDiv = document.getElementById('connected-status-message');
            if (statusDiv) {
                statusDiv.innerHTML = `<div class="status ${type}">${escapeHtml(message)}</div>`;

                if (type === 'success' || type === 'error') {
                    setTimeout(() => {
                        statusDiv.innerHTML = '';
                    }, 5000);
                }
            }
        }

        // Handle form submission
        document.getElementById('wifi-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!ssid || !password) {
                showMessage('Please enter both SSID and password', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/wifi/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' The page will reload once connected.', 'success');
                    document.getElementById('wifi-form').reset();

                    // Reload networks after a delay
                    setTimeout(() => {
                        loadNetworks();
                    }, 2000);

                    // Show message about potential connection loss
                    setTimeout(() => {
                        showMessage('Connecting to WiFi... You may need to reconnect to your home WiFi and access the device at its new IP address.', 'info');
                    }, 3000);

                } else {
                    showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                    showLoading(false);
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
                showLoading(false);
            }
        });

        async function loadNetworks() {
            try {
                const response = await fetch('/api/networks');
                const data = await response.json();

                const networkList = document.getElementById('network-list');

                if (data.networks && data.networks.length > 0) {
                    networkList.innerHTML = data.networks.map(network => `
                        <div class="network-item">
                            <span class="network-name">${escapeHtml(network.ssid)}</span>
                            <button class="remove-btn" onclick="removeNetwork('${escapeHtml(network.ssid)}')">Remove</button>
                        </div>
                    `).join('');
                } else {
                    networkList.innerHTML = '<p class="help-text">No saved networks yet</p>';
                }

            } catch (error) {
                console.error('Error loading networks:', error);
                document.getElementById('network-list').innerHTML =
                    '<p class="help-text">Error loading networks</p>';
            }
        }

        async function removeNetwork(ssid) {
            if (!confirm(`Remove network "${ssid}"?`)) {
                return;
            }

            try {
                const response = await fetch('/api/wifi/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    loadNetworks();
                } else {
                    showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
            }
        }

        function showMessage(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="status ${type}">${escapeHtml(message)}</div>`;

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                }, 5000);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('wifi-form').style.display = show ? 'none' : 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
